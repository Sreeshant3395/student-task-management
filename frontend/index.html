<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>Student Task Management</h1>
            <p>Organize your academic tasks in one place</p>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard Statistics -->
    <section class="stats-section">

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <p id="totalTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <p id="pendingTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>In Progress</h3>
            <p id="inProgressTasks">0</p>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <p id="completedTasks">0</p>
        </div>

    </section>

        <!-- Add Task Section -->
        <section class="task-form-section">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="form-group">
                    <label for="title">Task Title</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Enter task title"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        placeholder="Enter task description"
                    ></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            placeholder="e.g. Operating Systems"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="deadline">Deadline</label>
                        <input
                            type="date"
                            id="deadline"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="priority">Priority</label>

                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Status</label>

                        <select id="status">
                            <option value="Pending" selected>Pending</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="add-btn">
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task List Section -->
        <section class="task-list-section">

            <div class="section-header">
    <h2>My Tasks</h2>

    <button id="refreshBtn" class="refresh-btn">
        Refresh
    </button>
</div>

<!-- Search and Filters -->
<div class="filters">

    <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
    >

    <select id="statusFilter">
        <option value="All">All Status</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
    </select>

    <select id="priorityFilter">
        <option value="All">All Priorities</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
    </select>

</div>

            <div id="taskList">

                <!-- Tasks will be displayed here using JavaScript -->

                <p id="emptyMessage">
                    No tasks found. Add your first task!
                </p>

            </div>

        </section>

    </main>
<!-- Edit Task Modal -->
<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Edit Task</h2>

            <button
                type="button"
                id="closeModalBtn"
                class="close-btn">
                &times;
            </button>
        </div>

        <form id="editTaskForm">

            <input type="hidden" id="editTaskId">

            <div class="form-group">
                <label for="editTitle">Task Title</label>

                <input
                    type="text"
                    id="editTitle"
                    required
                >
            </div>

            <div class="form-group">
                <label for="editDescription">Description</label>

                <textarea
                    id="editDescription"
                ></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="editSubject">Subject</label>

                    <input
                        type="text"
                        id="editSubject"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="editDeadline">Deadline</label>

                    <input
                        type="date"
                        id="editDeadline"
                        required
                    >
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="editPriority">Priority</label>

                    <select id="editPriority">

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label for="editStatus">Status</label>

                    <select id="editStatus">

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="In Progress">
                            In Progress
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                    </select>
                </div>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelEditBtn"
                    class="cancel-btn">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>
    <script src="script.js"></script>

</body>
</html>
